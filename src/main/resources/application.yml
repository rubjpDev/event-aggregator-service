spring:
  datasource:
    url: jdbc:postgresql://db:5432/feverup
    username: admin
    password: toor
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379

logging:
  level:
    root: INFO
    com.feverup: DEBUG